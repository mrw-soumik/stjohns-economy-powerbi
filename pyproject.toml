[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stjohns-econ"
version = "0.1.0"
description = "ETL, data-quality tests and Power BI assets for a St. John's economy and housing dashboard built on Statistics Canada open data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mostafa Rafiur Wasib" }]
dependencies = ["pandas>=2.2", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
